version: 1
applications:
  - appRoot: apps/seller-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --prefix ../..
        build:
          commands:
            - npx next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        # node_modules is intentionally NOT cached: a stale dependency cache
        # could retain pre-consolidation @aws-amplify/* packages and resurface
        # the dual-Core-singleton "Auth UserPool not configured" bug. `npm ci`
        # rebuilds node_modules from the lockfile each build. Only the Next.js
        # content-keyed build cache is retained for speed.
        paths:
          - .next/cache/**/*
  - appRoot: apps/admin-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --prefix ../..
        build:
          commands:
            - npx next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        # See seller-dashboard note: node_modules deliberately not cached.
        paths:
          - .next/cache/**/*
